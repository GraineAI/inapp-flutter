// The Android side of the graine_inapp plugin: its calls channels
// (src/main/kotlin/ai/graine/inapp/flutter) compiled together with Graine's
// Android SDK, which the package carries in src/main/kotlin/ai/graine/inapp
// with its manifest (the call screen, the microphone service, the receiver, the
// Firebase messaging service and their permissions merge into the app from there).
group = "ai.graine.inapp.flutter"
version = "0.14.4"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Only for building this module on its own: inside an app, the app's
        // Android Gradle plugin and Kotlin are the ones used.
        classpath("com.android.tools.build:gradle:8.13.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

/*
 * WEBRTC FOR THE CALLS, OPT-IN (README → Calls like WhatsApp → WebRTC calls):
 * `graineWebRtc=true` in the app's android/gradle.properties, or GRAINE_WEBRTC=1
 * in the build's environment. On, the SDK's WebRTC module — carried in src/rtc
 * with the engine — is compiled into this plugin with its manifest and R8 rules,
 * and the WebRTC library is a dependency. Off, none of it is compiled or downloaded.
 */
def graineWebRtc = {
    def flag = project.findProperty("graineWebRtc") ?: providers.environmentVariable("GRAINE_WEBRTC").getOrNull()
    return flag != null && ["1", "true", "yes", "on"].contains(flag.toString().trim().toLowerCase())
}()
if (graineWebRtc && !file("src/rtc").isDirectory()) {
    throw new GradleException("graineWebRtc is on, but this copy of graine_inapp has no android/src/rtc")
}

// Kotlin is built into the Android Gradle plugin from 9.0 — unless the app
// turns it off (android.builtInKotlin=false, which Flutter's own app template
// sets while plugins migrate). Wherever it is not built in, this plugin's
// Kotlin is compiled by the Kotlin plugin, as plugins always did.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0].toInteger()
def builtInKotlinSetting = project.findProperty("android.builtInKotlin")
def kotlinIsBuiltIn = agpMajor >= 9 && (builtInKotlinSetting == null || builtInKotlinSetting.toString().toBoolean())
if (!kotlinIsBuiltIn) {
    apply plugin: "kotlin-android"
}

android {
    namespace = "ai.graine.inapp.flutter"
    compileSdk = 36

    defaultConfig {
        minSdk = 24
        consumerProguardFiles("consumer-rules.pro")
        // The WebRTC module's own: its entry class and the library's classes, which its native code calls by name.
        if (graineWebRtc) consumerProguardFiles("src/rtc/consumer-rules.pro")
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        if (graineWebRtc) main.java.srcDirs += "src/rtc/kotlin"
    }

    if (graineWebRtc) {
        // What the WebRTC module adds to the app's manifest (it watches the phone's networks), merged
        // into every build of this plugin: a library has one main manifest, and each build type may add one.
        buildTypes.configureEach { type -> android.sourceSets.maybeCreate(type.name).manifest.srcFile("src/rtc/AndroidManifest.xml") }
    }
}

dependencies {
    // Calls Graine rings: the SDK's own messaging service (GraineMessagingService, carried with the
    // engine and declared in its manifest) is compiled against Firebase Cloud Messaging — the version
    // the Android SDK compiles it against, exactly — and needs it only at run time, from the app:
    // com.google.firebase:firebase-messaging in android/app/build.gradle(.kts), or firebase_messaging.
    // An app without Firebase never starts the service and loads nothing of it.
    compileOnly("com.google.firebase:firebase-messaging:24.1.0")
    // "Require a verified app": the plugin's Play Integrity request (GraineFlutterPlayIntegrity.kt) and
    // the SDK's own (PlayIntegrity.kt, carried with the engine) are compiled against Play Integrity and need it
    // only at run time, from the app: implementation("com.google.android.play:integrity:1.4.0") in
    // android/app/build.gradle(.kts). An app without it is never asked to load either — both check first.
    compileOnly("com.google.android.play:integrity:1.4.0")
    if (graineWebRtc) {
        // A prebuilt build of Google's libwebrtc whose classes live in their own package, so it never
        // collides with another copy of WebRTC in the app. Pinned exactly as the Android SDK pins it.
        implementation("io.github.webrtc-sdk:android-prefixed-stripped:150.7871.01")
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}
