name: graine_inapp
# pub.dev shows 60-180 characters of this.
description: >-
  An AI agent inside your Flutter app: it sees the screen, acts in the app,
  shows components, talks, and takes calls with CallKit on iOS and a call
  screen on Android.
version: 0.10.3
homepage: https://www.graine.ai
documentation: https://www.graine.ai/docs/in-app/flutter
repository: https://github.com/GraineAI/inapp-flutter
issue_tracker: https://www.graine.ai/support
topics:
  - ai
  - chatbot
  - voice
  - callkit
  - customer-support
# The plugin declares these too; stated here so pub.dev never infers more.
platforms:
  android:
  ios:

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.1.0 <2.0.0"
  # onHttpError (4.8.0 / android 3.16.0 / wkwebview 3.13.0) is the oldest API used.
  webview_flutter: ^4.8.0
  webview_flutter_android: ">=3.16.0 <5.0.0"
  webview_flutter_wkwebview: ">=3.13.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ">=1.24.0 <2.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: ai.graine.inapp.flutter
        pluginClass: GraineInAppPlugin
      ios:
        pluginClass: GraineInAppPlugin
