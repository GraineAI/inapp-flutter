name: graine_inapp
description: >-
  Graine's in-app voice agent for Flutter: the hosted engine page in a WebView
  the SDK owns, plus screen context, in-app actions, components the agent
  draws, and a default agent bar.
version: 0.6.3
homepage: https://www.graine.ai
documentation: https://www.graine.ai/docs/in-app/flutter
repository: https://github.com/GraineAI/inapp-flutter

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.1.0 <2.0.0"
  # onHttpError (4.8.0 / android 3.16.0 / wkwebview 3.13.0) is the oldest API used.
  webview_flutter: ^4.8.0
  webview_flutter_android: ">=3.16.0 <5.0.0"
  webview_flutter_wkwebview: ">=3.13.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ">=1.24.0 <2.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: ai.graine.inapp.flutter
        pluginClass: GraineInAppPlugin
      ios:
        pluginClass: GraineInAppPlugin
